<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Author a test plan — jmxgen</title>
<link rel="stylesheet" href="run.css" />
<link rel="stylesheet" href="author.css" />
</head>
<body>
<div class="page">
  <header>
    <h1>Author a test plan</h1>
    <p class="sub">Every source the console accepts, without leaving the extension.</p>
    <p class="svc" id="svc">checking for jmxgen…</p>
  </header>

  <fieldset>
    <legend>Source</legend>
    <label for="mode">Where the requests come from</label>
    <select id="mode"></select>

    <div id="inputFile" hidden>
      <label for="file">File</label>
      <input type="file" id="file" />
    </div>
    <div id="inputText" hidden>
      <label for="text" id="textLabel">Input</label>
      <textarea id="text" spellcheck="false"></textarea>
    </div>
  </fieldset>

  <details id="filters">
    <summary>Traffic filters</summary>
    <label for="traffic">Keep</label>
    <select id="traffic">
      <option value="auto">auto — pages and service calls, no assets</option>
      <option value="api">api — service calls only</option>
      <option value="web">web — everything the browser fetched</option>
    </select>
    <div class="grid2">
      <div><label for="methods">Methods</label>
           <input type="text" id="methods" placeholder="blank = all" /></div>
      <div><label for="include">Include (regex)</label>
           <input type="text" id="include" placeholder="/api/" /></div>
      <div><label for="exclude">Exclude (regex)</label>
           <input type="text" id="exclude" placeholder="analytics|beacon" /></div>
    </div>
    <label class="chk"><input type="checkbox" id="realThink" /> Use recorded think times</label>
    <label class="chk"><input type="checkbox" id="noCorrelate" /> Skip correlation</label>
  </details>

  <details>
    <summary>Authentication</summary>
    <label for="loginPath">Login request</label>
    <input type="text" id="loginPath" placeholder="POST /oauth/token" />
    <label for="loginBody">Body</label>
    <input type="text" id="loginBody" placeholder='{"grant_type":"client_credentials"}' />
    <label for="loginToken">Token path</label>
    <input type="text" id="loginToken" placeholder="$.access_token" />
  </details>

  <details>
    <summary>Test data</summary>
    <div class="grid2">
      <div><label for="csvFile">CSV file</label>
           <input type="text" id="csvFile" placeholder="users.csv" /></div>
      <div><label for="csvCols">Columns</label>
           <input type="text" id="csvCols" placeholder="username,password" /></div>
    </div>
  </details>

  <fieldset>
    <legend>Load profile</legend>
    <div class="grid3">
      <div><label for="threads">Users</label>
           <input type="text" id="threads" placeholder="1" /></div>
      <div><label for="ramp">Ramp (s)</label>
           <input type="text" id="ramp" placeholder="1" /></div>
      <div><label for="dur">Duration (s)</label>
           <input type="text" id="dur" placeholder="blank = loop once" /></div>
    </div>
    <p class="hint">HyperExecute overrides all three at run time, so these are a starting point.</p>
  </fieldset>

  <div class="acts">
    <button id="go" class="go">Generate plan</button>
  </div>
  <div class="msg" id="msg"></div>

  <section id="results" hidden>
    <div class="cards" id="cards"></div>
    <div class="tabs">
      <button data-tab="steps" class="on">Requests</button>
      <button data-tab="corr">Correlations</button>
      <button data-tab="checks">Checks</button>
    </div>
    <div class="tabbody" id="tabbody"></div>

    <fieldset>
      <legend>Save</legend>
      <label for="planName">File name</label>
      <input type="text" id="planName" placeholder="plan.jmx" />
    </fieldset>

    <div class="acts">
      <button id="download">Download .jmx</button>
      <button id="validate">Validate (single user)</button>
      <button id="ship" class="go">Run on HyperExecute…</button>
    </div>
  </section>

  <details class="adv">
    <summary>Where jmxgen runs</summary>
    <input type="text" id="endpoint" placeholder="http://localhost:8770" />
  </details>
</div>
<script src="author.js"></script>
</body>
</html>
