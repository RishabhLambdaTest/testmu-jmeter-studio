name: My API Load Test
platform: hyperexecute
variables:
  BASE_HOST: api.example.com
defaults:
  protocol: https
  domain: ${BASE_HOST}
  connect_timeout: 5000
  response_timeout: 30000
headers:
  Content-Type: application/json
  Accept: application/json
cookies: true
csv:
- file: users.csv
  variables:
  - username
  - password
thread_groups:
- name: Load
  threads: 50
  ramp_up: 60
  duration: 600
  steps:
  - transaction: Login and fetch profile
    steps:
    - name: POST /login
      method: POST
      path: /login
      body:
        user: ${username}
        pass: ${password}
      extract:
      - type: json
        var: TOKEN
        query: $.token
      assert:
      - field: code
        match: equals
        pattern: '200'
      think_time:
        min: 500
        max: 1500
    - name: GET /profile
      method: GET
      path: /profile
      headers:
        Authorization: Bearer ${TOKEN}
      assert:
      - field: body
        match: contains
        pattern: email
      think_time: 1000
