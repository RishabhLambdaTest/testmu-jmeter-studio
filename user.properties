# JMeter User Properties
# Loaded via: jmeter -q user.properties

# Bandwidth Configuration (bytes per second)
# 1250000 cps = ~10 Mbps throttle for HTTPS connections
httpclient.socket.http.cps=0
httpclient.socket.https.cps=1250000

# Custom Percentile Reporting
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# HTML Report Granularity (ms)
jmeter.reportgenerator.overall_granularity=60000

# Apdex Thresholds (ms)
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500
